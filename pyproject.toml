[project]
name = "cli-hsr"
version = "0.2.0"
description = "Honkai: Star Rail CLI combat simulator and RL environment (Gymnasium) with model tournaments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "tensorboard>=2.16"]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "gymnasium>=0.29", "tensorboard>=2.16"]
all = ["gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "tensorboard>=2.16", "pytest>=8.0"]

[project.scripts]
cli-hsr = "cli_hsr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cli_hsr = ["../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
